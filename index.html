<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Age Calculator</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --box-bg: rgba(15, 23, 42, 0.6);
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        [data-theme="light"] {
            --bg-gradient: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 100%);
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: rgba(0, 0, 0, 0.08);
            --accent-color: #10b981;
            --accent-hover: #059669;
            --box-bg: #f1f5f9;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
            transition: background 0.3s, color 0.3s;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-main);
        }

        .calculator-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 480px;
            position: relative;
        }

        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
        }

        .theme-toggle {
            background: var(--box-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 14px;
        }

        input[type="date"] {
            width: 100%;
            padding: 14px;
            background: var(--box-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 16px;
            color: var(--text-main);
            outline: none;
        }

        input[type="date"]:focus {
            border-color: var(--accent-color);
        }

        button.btn-calc {
            width: 100%;
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }

        button.btn-calc:hover {
            background: var(--accent-hover);
        }

        .section-title {
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 20px 0 10px 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .result-container {
            margin-top: 25px;
            display: none;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            text-align: center;
        }

        .result-box {
            background: var(--box-bg);
            padding: 15px 10px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
        }

        .result-value {
            font-size: 26px;
            font-weight: 700;
            color: var(--accent-color);
            display: block;
        }

        .result-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .countdown-box {
            background: var(--box-bg);
            padding: 15px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            text-align: center;
            font-size: 16px;
            font-weight: 600;
        }

        .countdown-value {
            color: #ec4899;
        }

        .error-message {
            color: #ef4444;
            font-size: 14px;
            text-align: center;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="calculator-card">
        <div class="header-area">
            <h1>Age Calculator</h1>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">☀️ Light Mode</button>
        </div>
        
        <div class="input-group">
            <label for="birthdate">अपनी जन्मतिथि चुनें:</label>
            <input type="date" id="birthdate" required>
        </div>

        <button class="btn-calc" onclick="calculateEverything()">Calculate Age</button>
        
        <div id="error" class="error-message"></div>

        <div id="results" class="result-container">
            <div class="section-title">आपकी सटीक आयु</div>
            <div class="result-grid">
                <div class="result-box">
                    <span id="years" class="result-value">-</span>
                    <div class="result-label">वर्ष</div>
                </div>
                <div class="result-box">
                    <span id="months" class="result-value">-</span>
                    <div class="result-label">महीने</div>
                </div>
                <div class="result-box">
                    <span id="days" class="result-value">-</span>
                    <div class="result-label">दिन</div>
                </div>
            </div>

            <div class="section-title">अगला जन्मदिन</div>
            <div class="countdown-box" id="countdownContainer">
                अगले जन्मदिन में <span id="countdownText" class="countdown-value">-</span> बाकी हैं!
            </div>
        </div>
    </div>

    <script>
        // आज की तारीख सेट करना ताकि फ्यूचर डेट न चुनी जा सके
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('birthdate').setAttribute('max', today);

        // थीम बदलने का फंक्शन
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const themeBtn = document.getElementById('themeBtn');
            
            if (currentTheme === 'light') {
                document.documentElement.removeAttribute('data-theme');
                themeBtn.innerHTML = "☀️ Light Mode";
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                themeBtn.innerHTML = "🌙 Dark Mode";
            }
        }

        function calculateEverything() {
            const birthdateInput = document.getElementById('birthdate').value;
            const errorDiv = document.getElementById('error');
            const resultsDiv = document.getElementById('results');

            if (!birthdateInput) {
                showError("कृपया एक सही तारीख चुनें।");
                return;
            }

            const birthDate = new Date(birthdateInput);
            const currentDate = new Date();

            if (birthDate > currentDate) {
                showError("जन्मतिथि भविष्य की नहीं हो सकती।");
                return;
            }

            errorDiv.style.display = 'none';

            // 1. उम्र की गणना (Years, Months, Days)
            let years = currentDate.getFullYear() - birthDate.getFullYear();
            let months = currentDate.getMonth() - birthDate.getMonth();
            let days = currentDate.getDate() - birthDate.getDate();

            if (days < 0) {
                months--;
                const previousMonth = new Date(currentDate.getFullYear(), currentDate.getMonth(), 0);
                days += previousMonth.getDate();
            }

            if (months < 0) {
                years--;
                months += 12;
            }

            document.getElementById('years').innerText = years;
            document.getElementById('months').innerText = months;
            document.getElementById('days').innerText = days;

            // 2. अगले जन्मदिन का काउंटडाउन
            let nextBirthday = new Date(currentDate.getFullYear(), birthDate.getMonth(), birthDate.getDate());
            
            // अगर इस साल का जन्मदिन निकल चुका है, तो अगले साल का सेट करें
            if (currentDate > nextBirthday) {
                nextBirthday.setFullYear(currentDate.getFullYear() + 1);
            }

            const diffTime = Math.abs(nextBirthday - currentDate);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            let countdownString = "";
            if (diffDays === 365 || diffDays === 0) {
                countdownString = "आज ही है! जन्मदिन मुबारक हो! 🎂";
            } else {
                let nextMonths = nextBirthday.getMonth() - currentDate.getMonth();
